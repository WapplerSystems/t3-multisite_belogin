services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  WapplerSystems\MultisiteBelogin\:
    resource: '../Classes/*'

  WapplerSystems\MultisiteBelogin\Service\TokenGenerator:
    public: true

  WapplerSystems\MultisiteBelogin\Controller\TokenController:
    public: true

  WapplerSystems\MultisiteBelogin\Controller\LoginController:
    public: true

  WapplerSystems\MultisiteBelogin\EventListener\BeforeUserLogoutEventListener:
    tags:
      - name: event.listener
        identifier: 'multisiteBelogin-beforeUserLogoutEventListener'
        event: TYPO3\CMS\Core\Authentication\Event\BeforeUserLogoutEvent

  WapplerSystems\MultisiteBelogin\EventListener\AfterUserLoggedOutEventListener:
    tags:
      - name: event.listener
        identifier: 'multisiteBelogin-afterUserLoggedOutEventListener'
        event: TYPO3\CMS\Core\Authentication\Event\AfterUserLoggedOutEvent

  WapplerSystems\MultisiteBelogin\EventListener\AfterPagePreviewUriGeneratedEventListener:
    tags:
      - name: event.listener
        identifier: 'multisiteBelogin-afterPagePreviewUriEventListener'
        event: TYPO3\CMS\Backend\Routing\Event\AfterPagePreviewUriGeneratedEvent
